services:
  db:
    image: pgvector/pgvector:pg16          # Postgres 16 with pgvector preinstalled
    container_name: sec_copilot_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sec_copilot}
    ports:
      - "5433:5432"                        # your Mac's port 5432 -> the container's port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data    # keeps your data when the container restarts
      - ./db/init:/docker-entrypoint-initdb.d   # SQL files here run on first startup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sec_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: